<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super Coaching Onboarding</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;

  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

7.8L292.4 268.1L291.4 267.4L291.2 266.5"/><path class="iso-line iso-bevel" data-tone="faint" d="M337.3 262.7L335.4 263.1L319.1 276.8L318.4 277.2L317.6 277.3L316.7 277.1L293.4 267.5L292.8 267.1L291.2 266.5"/><path class="iso-line iso-edge" data-tone="mid" d="M291.2 266.5L291.7 265.7L308.2 251.8L309.4 251.2L310.9 251.1L312.4 251.4L336 261.1L337 261.8L337.3 262.7M337.3 282.8L336.7 283.6L320.2 297.5L319 298.1L317.5 298.3L316.1 297.9L292.4 288.2L291.4 287.5L291.2 286.6M337.3 262.7L337.3 282.8M291.2 266.5L291.2 286.6"/></g><g data-slot="fly"></g></svg><span class="sc-card-readout" data-readout>4 users &#xb7; 3 enrolled, 1 via the overlay</span><span class="sc-sr" role="status" aria-live="polite" data-status></span></div><script type="module">{const sync=()=>{let t=new URLSearchParams(location.search).get("theme");try{if(parent!==window&&parent.document.documentElement.dataset.theme)t=parent.document.documentElement.dataset.theme;}catch(e){}document.body.dataset.theme=t==="light"?"light":"dark";};sync();try{if(parent!==window)parent.addEventListener("themechange",sync);}catch(e){}}
// Super Coaching onboarding as a phone lying flat: users are pawns that walk the app's
// onboarding path across its screen. The moving parts and the timeline, shared by
// build.mjs (first frame) and the page (every frame). Pawns and blocks are drawn once
// at build and only translated here, so the page needs no 3D maths.

const SC = {
  X0: -16.4, // the screen's far-left corner, in world units
  Y0: -34.4,
  ZS: 4.45, // the screen's height
  SW: 32.8,
  SH: 68.8,
  // The onboarding path, in screen units (x across, y down the app): entry, the sign-up
  // card, a bend, the pick-a-course card, a bend, the Enroll button.
  PATH: [[16, 3.5], [9, 15], [23, 23], [12, 32], [20, 44], [16, 55.5]],
  CARD1: 1,
  CARD2: 3,
  EDGE: -1.6, // the phone's left edge, in screen units
  OFF: [-3.4, 33.6], // where a user who drops off steps over the edge
  BAR: [37.5, -25], // the growing bar on the chart, in world units
  BASE: 10.1, // its top before this period's sign-ups
  BLOCK: 2.4,
  WALK: 2.4, // seconds for an unguided walk down the whole path
  // Four example users; 2 and 4 are in the high-value segment.
  USERS: [
    { seg: false, t0: 0.3, kind: "convert" },
    { seg: true, t0: 2.6, kind: "drop" },
    { seg: false, t0: 5.2, kind: "convert" },
    { seg: true, t0: 8.8, kind: "guided" },
  ],
  OVERLAY_ON: 8.4,
};

const scSmooth = (x) => {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);
};
const scLerp = (a, b, t) => a + (b - a) * t;
const scClamp = (x) => Math.max(0, Math.min(1, x));

// Distance along the path to each waypoint.
const SC_D = SC.PATH.reduce((acc, p, i) => (i ? [...acc, acc[i - 1] + Math.hypot(p[0] - SC.PATH[i - 1][0], p[1] - SC.PATH[i - 1][1])] : [0]), []);
const SC_LEN = SC_D[SC_D.length - 1];
function scAlong(d) {
  for (let i = 1; i < SC.PATH.length; i++) {
    if (d <= SC_D[i] || i === SC.PATH.length - 1) {
      const q = scClamp((d - SC_D[i - 1]) / (SC_D[i] - SC_D[i - 1]));
      return [scLerp(SC.PATH[i - 1][0], SC.PATH[i][0], q), scLerp(SC.PATH[i - 1][1], SC.PATH[i][1], q)];
    }
  }
  return SC.PATH[0];
}

// Each user's script: walking legs (time span \u2192 path distance), then what happens.
const SC_SCRIPTS = SC.USERS.map((u, i) => {
  const legs = [];
  let t = u.t0 + 0.3; // after dropping onto the screen
  const walk = (d0, d1, slow = 1) => {
    const dt = ((d1 - d0) / SC_LEN) * SC.WALK * slow;
    legs.push({ t0: t, t1: t + dt, d0, d1 });
    t += dt;
  };
  const s = { n: i + 1, ...u, legs };
  if (u.kind === "drop") {
    walk(0, SC_D[SC.CARD2]);
    s.stop = t; // hesitates at the pick-a-course step
    s.leave = t + 0.55;
    s.edge = s.leave + 0.45; // over the edge
    s.land = s.edge + 0.35;
    s.gone = s.land + 0.3;
    return s;
  }
  if (u.kind === "guided") {
    walk(0, SC_D[SC.CARD1], 1.3);
    s.p1 = [t, t + 0.4];
    t += 0.4;
    walk(SC_D[SC.CARD1], SC_D[SC.CARD2], 1.3);
    s.p2 = [t, t + 0.4];
    t += 0.4;
    walk(SC_D[SC.CARD2], SC_LEN, 1.3);
  } else walk(0, SC_LEN);
  s.arrive = t; // taps Enroll
  s.jump = t + 0.12;
  s.land = s.jump + 0.7;
  s.gone = s.land + 0.28;
  return s;
});
SC_SCRIPTS.filter((s) => s.land && s.kind !== "drop").forEach((s, k) => (s.block = k));
const SC_GUIDED = SC_SCRIPTS.find((s) => s.kind === "guided");
const SC_OVERLAY_OFF = SC_GUIDED.arrive + 0.5;
const SC_LAST = Math.max(...SC_SCRIPTS.map((s) => s.gone));
const SC_LOOP = SC_LAST + 1.6 + 0.8;

// Where a user is on the screen at time t (screen units, plus a hop height).
function scWalkAt(s, t) {
  for (const leg of s.legs) {
    if (t < leg.t1) {
      const d = scLerp(leg.d0, leg.d1, scClamp((t - leg.t0) / (leg.t1 - leg.t0)));
      return { uv: scAlong(d), hop: t >= leg.t0 ? 0.9 * Math.abs(Math.sin((d / 3.4) * Math.PI)) : 0 };
    }
  }
  const last = s.legs[s.legs.length - 1];
  return { uv: scAlong(last.d1), hop: 0 };
}

const scWorld = ([u, v], z = 0) => [SC.X0 + u, SC.Y0 + v, SC.ZS + z];
const SC_CTA = scWorld(SC.PATH[SC.PATH.length - 1]);

function scState(t) {
  const reset = t > SC_LOOP - 0.8 ? scSmooth((t - (SC_LOOP - 0.8)) / 0.8) : 0;
  const keep = 1 - reset;
  const pawns = []; // { p, seg, alpha, scale, layer: "behind" | "on" | "fly" | "bar" }
  const events = [];
  let blocks = []; // { k, seg, drop, alpha }
  let flash = 0;
  const trails = []; // the arc a hopping user leaves behind
  for (const s of SC_SCRIPTS) {
    const who = s.seg ? `User ${s.n} \u00b7 high-value` : `User ${s.n}`;
    if (t < s.t0) continue;
    events.push({ t: s.t0, text: s.kind === "guided" ? `${who} \u00b7 guided by the overlay` : `${who} \u00b7 onboarding` });
    if (s.kind !== "drop" && t >= s.land) {
      const q = scClamp((t - s.land) / 0.3);
      blocks.push({ k: s.block, seg: s.seg, drop: 2.4 * (1 - scSmooth(q)), alpha: scSmooth(q / 0.6) * keep });
    }
    if (t >= s.gone) {
      if (s.kind === "drop") events.push({ t: s.leave, text: `${who} \u00b7 dropped off at step 2` });
      else events.push({ t: s.arrive, text: `${who} \u00b7 enrolled` });
      continue;
    }
    const entering = t < s.t0 + 0.3 ? scSmooth((t - s.t0) / 0.3) : 1;
    if (s.kind === "drop") {
      if (t < s.leave) {
        const { uv, hop } = scWalkAt(s, t);
        const wobble = t > s.stop ? 0.5 * Math.sin((t - s.stop) * 18) * (1 - scClamp((t - s.stop) / 0.55)) : 0;
        pawns.push({ p: scWorld([uv[0] + wobble, uv[1]], hop + 6 * (1 - entering)), seg: true, alpha: entering, layer: "on" });
      } else {
        events.push({ t: s.leave, text: `${who} \u00b7 dropped off at step 2` });
        const from = SC.PATH[SC.CARD2];
        if (t < s.edge) {
          const q = scSmooth((t - s.leave) / (s.edge - s.leave));
          const uv = [scLerp(from[0], SC.OFF[0], q), scLerp(from[1], SC.OFF[1], q)];
          pawns.push({ p: scWorld(uv, 0.9 * Math.abs(Math.sin(q * Math.PI * 3))), seg: true, alpha: 1, layer: "on" });
        } else {
          // Over the edge: falls to the plate beside the phone and fades.
          const q = scClamp((t - s.edge) / (s.land - s.edge));
          const uv = [SC.OFF[0] - 1.6 * q, SC.OFF[1] + 0.4 * q];
          const fade = 1 - scSmooth((t - s.land) / (s.gone - s.land));
          pawns.push({ p: scWorld(uv, -SC.ZS * q * q), seg: true, alpha: fade, layer: "behind" });
        }
      }
      continue;
    }
    if (t < s.arrive) {
      const { uv, hop } = scWalkAt(s, t);
      pawns.push({ p: scWorld(uv, hop + 6 * (1 - entering)), seg: s.seg, alpha: entering, layer: "on" });
      continue;
    }
    events.push({ t: s.arrive, text: `${who} \u00b7 enrolled` });
    flash = Math.max(flash, 1 - scClamp((t - s.arrive) / 0.45));
    const top = SC.BASE + s.block * SC.BLOCK;
    if (t < s.jump) pawns.push({ p: SC_CTA, seg: s.seg, alpha: 1, layer: "on" });
    else if (t < s.land) {
      // A hop off the Enroll button onto the growth chart.
      const q = (t - s.jump) / (s.land - s.jump);
      const e = scSmooth(q);
      const p = [scLerp(SC_CTA[0], SC.BAR[0], e), scLerp(SC_CTA[1], SC.BAR[1], e), scLerp(SC_CTA[2], top, e) + 13 * Math.sin(Math.PI * q)];
      pawns.push({ p, seg: s.seg, alpha: 1, layer: q < 0.75 ? "fly" : "bar" });
      trails.push({ to: [SC.BAR[0], SC.BAR[1], top], q, alpha: 1 });
    } else {
      trails.push({ to: [SC.BAR[0], SC.BAR[1], top], q: 1, alpha: 1 - scClamp((t - s.land) / 0.25) });
      const q = scClamp((t - s.land) / (s.gone - s.land));
      pawns.push({ p: [SC.BAR[0], SC.BAR[1], top + SC.BLOCK * scSmooth(q)], seg: s.seg, alpha: 1 - q, scale: 1 - 0.7 * q, layer: "bar" });
    }
  }
  // The overlay, for high-value users only: it dims the screen and spotlights the next step.
  let overlay = 0;
  if (t >= SC.OVERLAY_ON) overlay = scSmooth((t - SC.OVERLAY_ON) / 0.3) * (1 - scSmooth((t - SC_OVERLAY_OFF) / 0.3));
  if (t >= SC.OVERLAY_ON) events.push({ t: SC.OVERLAY_ON, text: "Overlay on \u00b7 for high-value users only" });
  const g = SC_GUIDED;
  const spot = t < g.p1[1] ? 0 : t < g.p1[1] + 0.3 ? scSmooth((t - g.p1[1]) / 0.3) : t < g.p2[1] ? 1 : 1 + scSmooth((t - g.p2[1]) / 0.3);
  blocks = blocks.sort((a, b) => a.k - b.k);
  return { t, pawns, trails, blocks, flash: flash * keep, overlay, spot, events, reset };
}

function scWords(s) {
  if (s.reset > 0) return "Next users";
  if (s.t >= SC_LAST) return `${SC.USERS.length} users \u00b7 3 enrolled, 1 via the overlay`;
  const latest = [...s.events].sort((a, b) => b.t - a.t);
  // A drop-off or the overlay switching on stays up a moment, over later steps.
  const hot = latest.find((e) => /dropped off|Overlay on/.test(e.text) && s.t - e.t < 1.6);
  return (hot || latest[0] || { text: "Users arriving" }).text;
}

// --- flat drawing in the screen's plane: x across, y down the app -------------

const scF = (v) => v.toFixed(2);
const scRound = (x, y, w, h, r) =>
  `M${scF(x + r)} ${scF(y)}H${scF(x + w - r)}A${r} ${r} 0 0 1 ${scF(x + w)} ${scF(y + r)}V${scF(y + h - r)}A${r} ${r} 0 0 1 ${scF(x + w - r)} ${scF(y + h)}H${scF(x + r)}A${r} ${r} 0 0 1 ${scF(x)} ${scF(y + h - r)}V${scF(y + r)}A${r} ${r} 0 0 1 ${scF(x + r)} ${scF(y)}Z`;
// The spotlight's three stops: the sign-up card, the course card, the Enroll button.
const SC_SPOTS = [
  { box: [1.8, 9.8, 29.2, 12.4, 2.8], tip: [6, 22.6, 20.8, 3.6], up: true },
  { box: [1.8, 24.8, 29.2, 16.4, 2.8], tip: [6, 42.2, 20.8, 3.6], up: true },
  { box: [3.8, 50.8, 25.2, 9.4, 4.7], tip: [6, 45.4, 20.8, 3.6], up: false },
];

function scScreen(s) {
  const out = [];
  if (s.overlay > 0.01) {
    const i = Math.min(1, Math.floor(s.spot));
    const q = s.spot - i;
    const A = SC_SPOTS[i];
    const B = SC_SPOTS[Math.min(2, i + 1)];
    const box = A.box.map((v, k) => scLerp(v, B.box[k], q));
    const hole = scRound(...box);
    const g = [`<path class="sc-dim" fill-rule="evenodd" d="${scRound(0, 0, SC.SW, SC.SH, 4)}${hole}"/>`, `<path class="sc-spot" d="${hole}"/>`];
    // The tooltip moves with the spotlight; it fades across the switch.
    const tipOf = (S, a) => {
      const [x, y, w, h] = S.tip;
      const py = S.up ? y : y + h;
      const pointer = S.up ? `M${x + w / 2 - 1.2} ${py}L${x + w / 2} ${py - 1.4}L${x + w / 2 + 1.2} ${py}Z` : `M${x + w / 2 - 1.2} ${py}L${x + w / 2} ${py + 1.4}L${x + w / 2 + 1.2} ${py}Z`;
      return `<g opacity="${scF(a)}"><path class="sc-tip" d="${scRound(x, y, w, h, 1.2)}${pointer}"/><path class="sc-on-tip" d="M${x + 1.6} ${y + 1.3}H${x + 11}M${x + 1.6} ${y + 2.5}H${x + 8}"/><path class="sc-tip-pill" d="${scRound(x + w - 6.2, y + 0.8, 5, 2, 1)}"/></g>`;
    };
    g.push(q < 0.5 ? tipOf(A, 1 - 2 * q) : tipOf(B, 2 * q - 1));
    out.push(`<g opacity="${scF(s.overlay)}">${g.join("")}</g>`);
  }
  // A ring that spreads from the Enroll button when it is tapped.
  if (s.flash > 0.01) {
    const g = (1 - s.flash) * 1.8;
    out.push(`<path class="sc-cta-ring" opacity="${scF(s.flash)}" d="${scRound(5 - g, 52 - g, 22.8 + 2 * g, 7 + 2 * g, 3.5 + g)}"/>`);
  }
  return out.join("");
}

// --- pawns and blocks: templates drawn at the world origin, moved by translation --

function scPlace(T, svg, p, alpha = 1, scale = 1) {
  const dx = p[0] * T.ex[0] + p[1] * T.ey[0] + p[2] * T.ez[0];
  const dy = p[0] * T.ex[1] + p[1] * T.ey[1] + p[2] * T.ez[1];
  const move = scale === 1 ? `translate(${scF(dx)} ${scF(dy)})` : `translate(${scF(T.o[0] + dx)} ${scF(T.o[1] + dy)}) scale(${scale.toFixed(3)}) translate(${scF(-T.o[0])} ${scF(-T.o[1])})`;
  return `<g transform="${move}"${alpha < 1 ? ` opacity="${Math.max(0, alpha).toFixed(3)}"` : ""}>${svg}</g>`;
}

function scRender(s, T) {
  const depth = (p) => p[0] * T.dv[0] + p[1] * T.dv[1] + p[2] * T.dv[2];
  const layer = (name) =>
    s.pawns
      .filter((w) => w.layer === name)
      .sort((a, b) => depth(a.p) - depth(b.p))
      .map((w) => scPlace(T, w.seg ? T.seg : T.pawn, w.p, w.alpha, w.scale || 1))
      .join("");
  const screenAt = (p) => [T.o[0] + p[0] * T.ex[0] + p[1] * T.ey[0] + p[2] * T.ez[0], T.o[1] + p[0] * T.ex[1] + p[1] * T.ey[1] + p[2] * T.ez[1]];
  const trails = s.trails
    .filter((a) => a.alpha > 0.02)
    .map((a) => {
      const pts = [];
      for (let i = 0; i <= 16; i++) {
        const q = (i / 16) * a.q;
        const e = scSmooth(q);
        pts.push(screenAt([scLerp(SC_CTA[0], a.to[0], e), scLerp(SC_CTA[1], a.to[1], e), scLerp(SC_CTA[2], a.to[2], e) + 13 * Math.sin(Math.PI * q)]));
      }
      return `<path class="sc-trail" opacity="${scF(a.alpha)}" d="M${pts.map(([x, y]) => `${scF(x)} ${scF(y)}`).join("L")}"/>`;
    })
    .join("");
  const stack = s.blocks.map((b) => scPlace(T, b.seg ? T.segBlock : T.block, [SC.BAR[0], SC.BAR[1], SC.BASE + b.k * SC.BLOCK + b.drop], b.alpha)).join("");
  return { behind: layer("behind"), on: layer("on"), bar: stack + layer("bar"), fly: trails + layer("fly"), screen: scScreen(s) };
}

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const slots = Object.fromEntries(["behind", "on", "bar", "fly", "screen"].map((n) => [n, svg.querySelector(`[data-slot="${n}"]`)]));
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const drawn = new Map();

let t = 0;
let frame = 0;
let last = 0;
let visible = false;

const put = (el, html) => {
  if (drawn.get(el) === html) return;
  el.innerHTML = html;
  drawn.set(el, html);
};

function draw(state) {
  const R = scRender(state, T);
  for (const key of Object.keys(slots)) put(slots[key], R[key]);
  const text = scWords(state);
  if (readout && readout.textContent !== text) readout.textContent = text;
  if (status && /enrolled|dropped off|Overlay on/.test(text) && status.textContent !== text) status.textContent = text;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  t = (t + dt) % SC_LOOP;
  draw(scState(t));
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

// Debug: #freeze=t holds the loop at t seconds, for stills.
const freeze = /freeze=([\d.]+)/.exec(location.hash);
if (freeze) {
  t = Number(freeze[1]);
  draw(scState(t));
} else {
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => (still.matches ? draw(scState(SC_LAST + 0.5)) : run()));
  if (still.matches) draw(scState(SC_LAST + 0.5));
}
window.__sc = { get: () => ({ t, loop: SC_LOOP }) };
