<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CRM + Lead Scoring</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

// CRM + Lead Scoring as a switchboard: the moving parts and the timeline, shared by
// build.mjs (first frame) and the page (every frame). Everything that moves is drawn
// flat in the plane of the jack panel, the CRM card or the phone's dial, so the page
// needs no 3D maths.

const CR = {
  SCORES: [82, 31, 58, 74, 45], // five example leads
  CUT: [40, 70], // score bands: under 40 suits product 1, under 70 product 2, else 3
  LEAD_U: [8, 20, 32, 44, 56], // lead columns across the panel, in panel units
  PROD_U: [14, 32, 50], // product jack groups
  GAUGE_V: 10.4, // the gauges' pivots
  GAUGE_R: 4.4,
  LAMP_V: 13.8,
  JACK_V: 17.4,
  PLATE_V: 22.2,
  PROD_V: 28.4,
  CARD_W: 16,
  CARD_H: 12,
  START: 0.5,
  STEP: 2.8,
  DIGITS: [[3, 1], [2, 4], [5, 2], [1, 3], [4, 2]], // what the dialler dials, per lead
};

const crSmooth = (x) => {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);
};
const crLerp = (a, b, t) => a + (b - a) * t;
// A needle that swings past its mark and settles back.
const crBack = (x) => {
  const t = Math.max(0, Math.min(1, x)) - 1;
  return 1 + 2.4 * t * t * t + 1.4 * t * t;
};
const crBand = (score) => (score < CR.CUT[0] ? 0 : score < CR.CUT[1] ? 1 : 2);
const crPull = (d) => 30 + 30 * (d || 10); // degrees the finger wheel turns for digit d

// The timeline: one lead after another, each scored, patched, dialled and connected.
const CR_LEADS = CR.SCORES.map((score, i) => {
  const p = crBand(score);
  const slot = CR.SCORES.slice(0, i).filter((s) => crBand(s) === p).length;
  const t0 = CR.START + i * CR.STEP;
  const dial = t0 + 1.45;
  let at = dial;
  const digits = CR.DIGITS[i].map((d) => {
    const a = crPull(d);
    const digit = { a, s: at, wind: 0.08 + a / 1600, back: a / 1000 };
    at += digit.wind + digit.back + 0.05;
    return digit;
  });
  return {
    i,
    score,
    p,
    t0,
    u: CR.LEAD_U[i],
    pu: CR.PROD_U[p] + (slot ? 2.7 : -2.7),
    needle: t0 + 0.2,
    patch: t0 + 0.85,
    plug: t0 + 1.35,
    dial,
    digits,
    connect: at + 0.05,
    end: t0 + CR.STEP,
  };
});
const CR_LAST = CR_LEADS[CR_LEADS.length - 1].end;
const CR_LOOP = CR_LAST + 1.8 + 0.8;

function crState(t) {
  const reset = t > CR_LOOP - 0.8 ? crSmooth((t - (CR_LOOP - 0.8)) / 0.8) : 0;
  const keep = 1 - reset;
  const leads = CR_LEADS.map((L) => {
    let lamp = 0;
    if (t >= L.t0 && t < L.plug) lamp = Math.sin((t - L.t0) * Math.PI * 2 * 2.4) > -0.3 ? 1 : 0.15; // ringing
    else if (t >= L.plug && t < L.end) lamp = 1;
    else if (t >= L.end) lamp = 0.35 * keep; // handled
    const needle = t < L.needle ? 0 : L.score * crBack((t - L.needle) / 0.55) * keep;
    return { lamp, needle };
  });
  const cords = [];
  let active = -1;
  let card = { lead: -1, rise: 0 };
  let dial = 0;
  let connected = 0;
  const events = [];
  CR_LEADS.forEach((L, i) => {
    const n = i + 1;
    if (t >= L.t0) events.push({ t: L.t0, text: `Lead ${n} \u00b7 scoring` });
    if (t < L.patch) return;
    events.push({ t: L.patch, text: `Lead ${n} \u00b7 score ${L.score} \u2192 product ${L.p + 1}` });
    // The cord's free plug travels from the lead's jack to its product's jack.
    const q = crSmooth((t - L.patch) / (L.plug - L.patch));
    const b = [crLerp(L.u, L.pu, q) + 0.01, crLerp(CR.JACK_V, CR.PROD_V, q) - 4 * Math.sin(Math.PI * q)];
    cords.push({ a: [L.u, CR.JACK_V], b, alpha: crSmooth((t - L.patch) / 0.15) * keep, live: t < L.end });
    if (t >= L.plug && t < L.end) active = i;
    if (t >= L.plug && t < L.end + 0.3) card = { lead: i, rise: crSmooth((t - L.plug) / 0.3) * (1 - crSmooth((t - L.end + 0.05) / 0.3)) };
    if (t >= L.dial) events.push({ t: L.dial, text: `Lead ${n} \u00b7 auto-dialling` });
    for (const d of L.digits) {
      // Wound round to the finger stop, then back at the governor's steady pace.
      if (t >= d.s && t < d.s + d.wind) dial = d.a * crSmooth((t - d.s) / d.wind);
      else if (t >= d.s + d.wind && t < d.s + d.wind + d.back) dial = d.a * (1 - (t - d.s - d.wind) / d.back);
    }
    if (t >= L.connect) {
      events.push({ t: L.connect, text: `Lead ${n} \u00b7 connected \u00b7 CRM card up` });
      if (t < L.end + 0.2) connected = crSmooth((t - L.connect) / 0.12) * (1 - crSmooth((t - L.end) / 0.2));
    }
  });
  return { t, leads, cords, active, product: active >= 0 ? CR_LEADS[active].p : -1, card, dial, connected, events, reset };
}

function crWords(s) {
  if (s.reset > 0) return "Next leads";
  if (s.t >= CR_LAST) return `${CR.SCORES.length} leads \u00b7 scored, matched, auto-dialled`;
  const latest = [...s.events].sort((a, b) => b.t - a.t)[0];
  return latest ? latest.text : "Leads coming in";
}

// --- flat drawing helpers, also used by build.mjs ---------------------------

const crF = (v) => v.toFixed(2);
const crRound = (x, y, w, h, r) =>
  `M${crF(x + r)} ${crF(y)}H${crF(x + w - r)}A${r} ${r} 0 0 1 ${crF(x + w)} ${crF(y + r)}V${crF(y + h - r)}A${r} ${r} 0 0 1 ${crF(x + w - r)} ${crF(y + h)}H${crF(x + r)}A${r} ${r} 0 0 1 ${crF(x)} ${crF(y + h - r)}V${crF(y + r)}A${r} ${r} 0 0 1 ${crF(x + r)} ${crF(y)}Z`;
const crDots = (cx, cy, n, cls, gap = 1.6, r = 0.5) =>
  Array.from({ length: n }, (_, j) => `<circle class="${cls}" cx="${crF(cx + (j - (n - 1) / 2) * gap)}" cy="${crF(cy)}" r="${r}"/>`).join("");
// A gauge reads 0 at the left of its arc and 100 at the right.
const crAngle = (score) => ((-56 + 1.12 * score) * Math.PI) / 180;

// --- the jack panel, in its own plane: x right, y down, in world units --------

function crCordPath(a, b) {
  const [ax, ay] = [a[0], a[1] + 1];
  const [bx, by] = [b[0], b[1] + 1];
  const sag = 2.4 + Math.abs(bx - ax) * 0.1 + Math.abs(by - ay) * 0.2;
  return `M${crF(ax)} ${crF(ay)}C${crF(ax)} ${crF(ay + sag + Math.max(0, by - ay) * 0.6)} ${crF(bx)} ${crF(by + sag * 0.8)} ${crF(bx)} ${crF(by)}`;
}

function crPanel(s) {
  const out = [];
  s.leads.forEach((L, i) => {
    const u = CR.LEAD_U[i];
    const a = crAngle(L.needle);
    const r = CR.GAUGE_R - 0.3;
    out.push(`<path class="cr-needle" d="M${u} ${CR.GAUGE_V}L${crF(u + r * Math.sin(a))} ${crF(CR.GAUGE_V - r * Math.cos(a))}"/>`);
    if (L.lamp > 0.02) out.push(`<circle class="cr-lamp-on" cx="${u}" cy="${CR.LAMP_V}" r="1.05" opacity="${crF(L.lamp)}"/>`);
  });
  if (s.product >= 0) {
    const pu = CR.PROD_U[s.product];
    out.push(`<path class="cr-plate-on" d="${crRound(pu - 4.4, CR.PLATE_V, 8.8, 3, 0.8)}"/>`, crDots(pu, CR.PLATE_V + 1.5, s.product + 1, "cr-plate-on-dot"));
  }
  const cords = [];
  const plugs = [];
  for (const c of s.cords) {
    const d = crCordPath(c.a, c.b);
    const cord = `<path class="cr-cord-edge" d="${d}"/><path class="cr-cord${c.live ? " cr-live" : ""}" d="${d}"/>`;
    const plug = [c.a, c.b].map(([u, v]) => `<circle class="cr-plug" cx="${crF(u)}" cy="${crF(v)}" r="1.6"/><circle class="cr-plug-tip" cx="${crF(u)}" cy="${crF(v)}" r="0.55"/>`).join("");
    const fade = (svg) => (c.alpha < 1 ? `<g opacity="${crF(Math.max(0, c.alpha))}">${svg}</g>` : svg);
    cords.push(fade(cord));
    plugs.push(fade(plug));
  }
  return out.join("") + cords.join("") + plugs.join("");
}

// --- the CRM card, in its own plane; 0,0 is the left end of the slit it rises from

function crCard(s) {
  const top = -(0.8 + 11 * s.card.rise);
  const L = s.card.lead >= 0 ? CR_LEADS[s.card.lead] : null;
  const g = [`<path class="cr-card" d="${crRound(0, 0, CR.CARD_W, CR.CARD_H, 1)}"/>`];
  if (L) {
    const name = [8.6, 6.8, 9.4, 7.6, 8.2][L.i];
    g.push(`<circle class="cr-ink-dot" cx="2.8" cy="2.9" r="1.5"/>`);
    g.push(`<path class="cr-ink" d="M5.4 2.2H${crF(5.4 + name)}"/><path class="cr-ink cr-thin" d="M5.4 3.9H${crF(5.4 + name * 0.62)}"/>`);
    g.push(`<path class="cr-track" d="M1.8 7H14.2"/><path class="cr-bar" d="M1.8 7H${crF(1.8 + (12.4 * L.score) / 100)}"/>`);
    g.push(`<path class="cr-ink cr-thin" d="M1.8 9.8H7.2"/>`, crDots(12.2, 9.8, L.p + 1, "cr-ink-dot", 1.5, 0.5));
  }
  return `<g transform="translate(0 ${crF(top)})">${g.join("")}</g>`;
}
// Live behaviour: the switchboard works through its example leads on its own. Everything
// that moves is flat in the panel's, the card's or the dial's plane, so no kit is needed.
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const panel = svg.querySelector('[data-slot="panel"]');
const card = svg.querySelector('[data-slot="card"]');
const wheel = svg.querySelector('[data-slot="wheel"]');
const keys = [...svg.querySelectorAll("[data-key]")];
const connected = svg.querySelector("[data-connected]");
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const drawn = new Map();

let t = 0;
let frame = 0;
let last = 0;
let visible = false;

const put = (el, html) => {
  if (drawn.get(el) === html) return;
  el.innerHTML = html;
  drawn.set(el, html);
};

function draw(state) {
  put(panel, crPanel(state));
  put(card, crCard(state));
  const turn = `rotate(${state.dial.toFixed(1)})`;
  if (wheel.getAttribute("transform") !== turn) wheel.setAttribute("transform", turn);
  keys.forEach((el, i) => (el.style.opacity = state.active === i ? "1" : "0"));
  connected.style.opacity = state.connected.toFixed(3);
  const text = crWords(state);
  if (readout && readout.textContent !== text) readout.textContent = text;
  if (status && /connected|auto-dialled/.test(text) && status.textContent !== text) status.textContent = text;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  t = (t + dt) % CR_LOOP;
  draw(crState(t));
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

// Debug: #freeze=t holds the loop at t seconds, for stills.
const freeze = /freeze=([\d.]+)/.exec(location.hash);
if (freeze) {
  t = Number(freeze[1]);
  draw(crState(t));
} else {
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => (still.matches ? draw(crState(CR_LAST + 0.5)) : run()));
  if (still.matches) draw(crState(CR_LAST + 0.5));
}
window.__cr = { get: () => ({ t, loop: CR_LOOP }) };
</script></body></html>
