<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Call Analysis</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

// AI Call Analysis as a cassette review line: the moving parts and the timeline,
// shared by build.mjs (first frame) and the page (every frame). Kit functions come
// in as K, so the same source runs in Node and inline in the page.

const CA = {
  X_MAG: -70, // the magazine of calls waiting for review
  X_READ: -19, // the AI reader
  CY: 5, // a tape's centre line on the belt
  BELT: { x0: -80, x1: 80, y0: -4, y1: 14 },
  BELT_TOP: 14,
  RAIL_TOP: 16,
  TAPE: { w: 20, d: 12.8, h: 2.4 },
  SCORES: ["hot", "warm", "cold"],
  STATION: [14, 38, 62], // a pusher and a bin per score, along the belt
  MARKS: [3, 2, 1], // what the reader stamps on the label for each score
  // Six example calls and the score each one gets: warm, hot, cold, warm, hot, warm.
  CALLS: [1, 0, 2, 1, 0, 1],
  T: 2.2, // a new call leaves the magazine every T seconds
  HEAD_UP: 32, // the reader's underside: high enough to see the tape it's reading
  HEAD_DOWN: 16.8, // its pad rests on the tape's top (14 + 2.4)
  BIN: { y: 22, d: 18, w: 24, wall: 1, top: 12, floor: 1.2 },
  PLATE_REST: -8.6, // pusher plate's back face at rest, behind the back rail
  PUSHED: 23, // tape centre once it's off the belt
  IN_BIN: 31, // tape centre in its bin
  BOARD_Y: -35, // the insight board's face
};

const caSmooth = (x) => {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);
};
const caLerp = (a, b, t) => a + (b - a) * t;

function caTimes(i) {
  const s = CA.CALLS[i];
  const trip = (CA.STATION[s] - CA.X_READ) / 60;
  const p0 = 2.4 + trip; // push starts
  return { start: i * CA.T, s, trip, p0, land: p0 + 0.8 };
}
const CA_LAST = Math.max(...CA.CALLS.map((_, i) => caTimes(i).start + caTimes(i).land));
const CA_LOOP = CA_LAST + 2.0 + 1.2; // hold the full board, then file the batch and reload

// Everything at time t of the loop.
function caState(t) {
  const { TAPE, CALLS } = CA;
  const reset = t > CA_LOOP - 1.2 ? caSmooth((t - (CA_LOOP - 1.2)) / 1.2) : 0;
  const tapes = [];
  const counts = [0, 0, 0];
  const push = [0, 0, 0];
  let head = CA.HEAD_UP;
  let listen = 0;
  const arrivals = [0, 0, 0];
  const states = [];
  CALLS.forEach((s, i) => {
    const { start, trip, p0, land } = caTimes(i);
    const tau = t - start;
    const level = arrivals[s]++;
    const binZ = CA.BIN.floor + level * TAPE.h;
    // The stack in the magazine drops by one as each earlier tape clears it.
    let stack = i;
    for (let k = 0; k < i; k++) stack -= caSmooth((t - caTimes(k).start - 0.45) / 0.25);
    const tape = { i, s, x: CA.X_MAG, y: CA.CY, z: CA.BELT_TOP + stack * TAPE.h, slot: "mag", marks: 0, spin: 0, alpha: 1 };
    tape.spin = Math.max(0, Math.min(0.8, tau - 1.2)) * 9;
    if (tau >= 2.1) tape.marks = CA.MARKS[s];
    if (tau < 0) {
      tapes.push(tape);
      return;
    }
    tape.z = CA.BELT_TOP;
    tape.slot = "belt";
    let phase = "in";
    if (tau < 1) tape.x = caLerp(CA.X_MAG, CA.X_READ, caSmooth(tau));
    else if (tau < 2.4) {
      tape.x = CA.X_READ;
      phase = tau < 2.0 ? "listening" : "scored";
      if (tau < 1.2) (head = caLerp(CA.HEAD_UP, CA.HEAD_DOWN, caSmooth((tau - 1) / 0.2))), (listen = caSmooth((tau - 1) / 0.2));
      else if (tau < 2.0) (head = CA.HEAD_DOWN), (listen = 1);
      else if (tau < 2.2) (head = CA.HEAD_DOWN + 1.2 * Math.sin((Math.PI * (tau - 2.0)) / 0.2)), (listen = 1); // the stamp taps
      else (head = caLerp(CA.HEAD_DOWN, CA.HEAD_UP, caSmooth((tau - 2.2) / 0.2))), (listen = 1 - caSmooth((tau - 2.2) / 0.2));
    } else if (tau < p0) {
      tape.x = caLerp(CA.X_READ, CA.STATION[s], caSmooth((tau - 2.4) / trip));
      phase = "sorting";
    } else if (tau < p0 + 0.45) {
      const e = caSmooth((tau - p0) / 0.45);
      push[s] = e;
      tape.x = CA.STATION[s];
      tape.y = Math.max(CA.CY, caLerp(CA.PLATE_REST + 1.2, CA.PUSHED - TAPE.d / 2, e) + TAPE.d / 2);
      phase = "sorting";
    } else {
      push[s] = Math.max(push[s], 1 - caSmooth((tau - p0 - 0.45) / 0.5));
      tape.x = CA.STATION[s];
      tape.slot = "bin";
      if (tau < land) {
        const q = (tau - p0 - 0.45) / 0.35;
        tape.y = caLerp(CA.PUSHED, CA.IN_BIN, caSmooth(q / 0.5));
        const fall = Math.max(0, (q - 0.3) / 0.7);
        tape.z = caLerp(CA.BELT_TOP, binZ, Math.min(1, fall * fall));
        phase = "sorting";
      } else {
        tape.y = CA.IN_BIN;
        tape.z = binZ;
        tape.alpha = 1 - reset;
        counts[s] += caSmooth((tau - land) / 0.3) * (1 - reset);
        phase = "filed";
      }
    }
    tapes.push(tape);
    states.push({ i, s, phase, tau });
  });
  // During the reset the magazine is reloaded with the next batch.
  if (reset > 0) for (let j = 0; j < CALLS.length; j++) tapes.push({ i: -1 - j, s: 1, x: CA.X_MAG, y: CA.CY, z: CA.BELT_TOP + j * TAPE.h, slot: "mag", marks: 0, spin: 0, alpha: reset });
  return { t, tapes, counts, push, head, listen, reset, states, belt: (t * 40) % 6 };
}

function caWords(s) {
  const rank = { listening: 3, scored: 3, in: 1, sorting: 2 };
  const live = s.states.filter((x) => x.phase !== "filed");
  if (!live.length) {
    if (s.reset > 0) return "Loading the next calls";
    const c = s.counts.map((v) => Math.round(v));
    return `${CA.CALLS.length} calls \u00b7 hot ${c[0]} \u00b7 warm ${c[1]} \u00b7 cold ${c[2]}`;
  }
  const f = live.sort((a, b) => rank[b.phase] - rank[a.phase] || b.i - a.i)[0];
  const n = f.i + 1;
  const score = CA.SCORES[f.s];
  if (f.phase === "in") return `Call ${n} \u00b7 in`;
  if (f.phase === "listening") return `Call ${n} \u00b7 listening`;
  if (f.phase === "scored") return `Call ${n} \u00b7 scored ${score}`;
  return `Call ${n} \u00b7 to the ${score} bin`;
}

// --- drawing -------------------------------------------------------------

const caPlan = (x, y, w, d, r = 0.4) => ({ x, y, w, d, r });

// One call tape lying flat: a cassette with its label, window, two reels and screws.
function caTape(tp, P, K) {
  const { x, y, z } = tp;
  const { w, d, h } = CA.TAPE;
  const top = z + h;
  const out = [K.solidSvg(K.slabOf(caPlan(x - w / 2, y - d / 2, w, d, 1), z, h, P, 3, 0.3), { tone: "mid" })];
  const label = caPlan(x - 8, y - 5.2, 16, 4.4, 0.4);
  out.push(K.lineSvg(K.planOutline(label, top, P, 2), { tone: "faint" }));
  if (tp.marks) {
    const marks = Array.from({ length: tp.marks }, (_, m) => K.lineOnTop([x - 6 + m * 1.9, y - 4.4], [x - 6 + m * 1.9, y - 1.6], top, P)).join("");
    out.push(`<g class="ca-mark">${K.lineSvg(marks, { tone: "lit", free: true })}</g>`);
  }
  out.push(K.lineSvg(K.planOutline(caPlan(x - 3.2, y + 1.3, 6.4, 1.8, 0.6), top, P, 2), { tone: "lo" }));
  for (const hx of [x - 6, x + 6]) {
    const hy = y + 2.2;
    const spokes = Array.from({ length: 6 }, (_, k) => {
      const a = tp.spin + (k * Math.PI) / 3;
      return K.lineOnTop([hx + 0.7 * Math.cos(a), hy + 0.7 * Math.sin(a)], [hx + 1.9 * Math.cos(a), hy + 1.9 * Math.sin(a)], top, P);
    }).join("");
    out.push(K.lineSvg(K.ring(hx, hy, 1.9, top, P, 20) + K.ring(hx, hy, 0.7, top, P, 12), { tone: "lo" }));
    out.push(K.lineSvg(spokes, { tone: "lo" }));
  }
  out.push(K.dotsSvg([[x - w / 2 + 1.1, y - d / 2 + 1.1], [x + w / 2 - 1.1, y - d / 2 + 1.1], [x - w / 2 + 1.1, y + d / 2 - 1.1], [x + w / 2 - 1.1, y + d / 2 - 1.1]].map(([a, b]) => K.iso([a, b, top], P)), { size: 0.35 }));
  const svg = out.join("");
  return tp.alpha < 1 ? `<g opacity="${Math.max(0, tp.alpha).toFixed(3)}">${svg}</g>` : svg;
}

function caHead(s, P, K) {
  const x = CA.X_READ;
  const out = [];
  out.push(K.solidSvg(K.slabOf(caPlan(x - 1, CA.CY - 1, 2, 2, 0.5), s.head + 2.4, CA.HEAD_UP + 2 - (s.head + 2.4), P, 2), { tone: "mid", crease: "none" }));
  out.push(K.solidSvg(K.slabOf(caPlan(x - 4.5, CA.CY - 3.5, 9, 7, 1), s.head, 2.4, P, 3, 0.3), { tone: "mid" }));
  out.push(K.solidSvg(K.slabOf(caPlan(x - 2.6, CA.CY - 1.4, 5.2, 2.8, 0.6), s.head - 0.4, 0.4, P, 2), { tone: "hi", crease: "none" }));
  return out.join("");
}

// The waveform on the reader's screen, in the plane of its front face.
function caWave(s, P, K, face) {
  const amp = s.listen;
  const points = [];
  for (let u = 0; u <= 18; u += 0.4) {
    const ph = s.t * 11;
    const v = amp * 2.4 * Math.sin(u * 1.9 + ph) * (0.55 + 0.45 * Math.sin(u * 0.45 + ph * 0.37));
    points.push([u, 2.8 - v]); // face coordinates run down from the screen's top edge
  }
  const d = points.map(([u, v], k) => `${k ? "L" : "M"}${u.toFixed(2)} ${v.toFixed(2)}`).join("");
  return `<g transform="${K.sideMatrix([face.x0, face.y], face.z0, P, "left")}"><path class="iso-line ca-wave" data-tone="${amp > 0.02 ? "lit" : "lo"}" d="${d}"/></g>`;
}

function caPushers(s, P, K) {
  const out = [];
  CA.STATION.forEach((x, k) => {
    const back = caLerp(CA.PLATE_REST, CA.PUSHED - CA.TAPE.d / 2 - 1.2, s.push[k]);
    out.push(K.solidSvg(K.slabOf(caPlan(x - 1, -11, 2, back + 0.01 - -11, 0.5), 15.2, 2, P, 2), { tone: "mid", crease: "none" }));
    out.push(K.solidSvg(K.slabOf(caPlan(x - 8, back, 16, 1.2, 0.4), CA.BELT_TOP + 0.2, 3.6, P, 2, 0.3), { tone: "mid" }));
  });
  return out.join("");
}

function caBelt(s, P, K) {
  const lines = [];
  for (let x = CA.BELT.x0 + s.belt; x < CA.BELT.x1; x += 6) lines.push(K.lineOnTop([x, CA.BELT.y0], [x, CA.BELT.y1], CA.BELT_TOP, P));
  return K.lineSvg(lines.join(""), { tone: "faint" });
}

function caMeters(s, P, K) {
  const out = [];
  CA.STATION.forEach((cx, c) => {
    const n = s.counts[c];
    for (let j = 0; j < CA.CALLS.length; j++) {
      const a = Math.max(0, Math.min(1, n - j));
      if (a <= 0.01) continue;
      const zb = 8 + j * 4.4;
      const d = K.pathOf([[cx - 5, CA.BOARD_Y, zb], [cx + 5, CA.BOARD_Y, zb], [cx + 5, CA.BOARD_Y, zb + 3], [cx - 5, CA.BOARD_Y, zb + 3]].map((p) => K.iso(p, P)), true);
      out.push(`<path class="ca-led" d="${d}"${a < 1 ? ` opacity="${a.toFixed(3)}"` : ""}/>`);
    }
  });
  return out.join("");
}

function caRender(s, P, K, face) {
  const mag = s.tapes.filter((tp) => tp.slot === "mag").sort((a, b) => a.z - b.z);
  const belt = s.tapes.filter((tp) => tp.slot === "belt").sort((a, b) => a.x - b.x);
  return {
    meters: caMeters(s, P, K),
    texture: caBelt(s, P, K),
    pushers: caPushers(s, P, K),
    mag: mag.map((tp) => caTape(tp, P, K)).join(""),
    belt: belt.map((tp) => caTape(tp, P, K)).join("") + caHead(s, P, K),
    screen: caWave(s, P, K, face),
    bins: CA.STATION.map((_, k) => s.tapes.filter((tp) => tp.slot === "bin" && tp.s === k).sort((a, b) => a.z - b.z || a.y - b.y).map((tp) => caTape(tp, P, K)).join("")),
  };
}
// Live behaviour: the line runs on its own, looping its batch of example calls.
// Runs after the kit (globals) and parts.mjs.
const DATA = {"P":{"origin":[301.5990919942803,195.97706570100593],"scale":2.204053622842555,"azimuth":55,"elevation":38},"face":{"x0":-28,"y":21,"z0":40}};
const P = DATA.P;
const K = { slabOf, solidSvg, lineSvg, dotsSvg, iso, pathOf, planOutline, ring, lineOnTop, sideMatrix };
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const slot = (name) => svg.querySelector(`[data-slot="${name}"]`);
const slots = {
  meters: slot("meters"),
  texture: slot("texture"),
  pushers: slot("pushers"),
  mag: slot("mag"),
  belt: slot("belt"),
  screen: slot("screen"),
  bins: CA.STATION.map((_, c) => slot(`bin-${c}`)),
};
const aiLit = [...svg.querySelectorAll(".ca-ai-lit")];
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const drawn = new Map();

let t = 0;
let frame = 0;
let last = 0;
let visible = false;

const put = (el, html) => {
  if (drawn.get(el) === html) return;
  el.innerHTML = html;
  drawn.set(el, html);
};

function draw(state) {
  const R = caRender(state, P, K, DATA.face);
  for (const key of ["meters", "texture", "pushers", "mag", "belt", "screen"]) put(slots[key], R[key]);
  R.bins.forEach((html, c) => put(slots.bins[c], html));
  aiLit.forEach((el) => (el.style.opacity = state.listen.toFixed(3)));
  const text = caWords(state);
  if (readout && readout.textContent !== text) readout.textContent = text;
  if (status && /calls \u00b7/.test(text) && status.textContent !== text) status.textContent = text;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  t = (t + dt) % CA_LOOP;
  draw(caState(t));
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

// Debug: #freeze=t holds the loop at t seconds, for stills.
const freeze = /freeze=([\d.]+)/.exec(location.hash);
if (freeze) {
  t = Number(freeze[1]);
  draw(caState(t));
} else {
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => (still.matches ? draw(caState(CA_LAST + 1)) : run()));
  if (still.matches) draw(caState(CA_LAST + 1));
}
window.__ca = { get: () => ({ t, loop: CA_LOOP }) };
