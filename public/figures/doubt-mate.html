<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doubt Mate</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

`;
// Doubt Mate as a card cabinet: the moving parts and the timeline, shared by
// build.mjs (first frame) and the page (every frame). Kit functions come in as K
// and the lathe as G, so the same source runs in Node and inline in the page.

const DM = {
  X_IN: -70, // intake slot (doubt card)
  X_OUT: 70, // answer stand
  PICK_Y: 30, // the picker's plane, between the two rails
  HOME: 44, // head bottom when travelling: carried cards clear the drawer fronts
  READ: 34, // head bottom when reading the doubt card
  GRAB: 23.2, // head bottom when gripping two cards in a drawer
  PLACE: 22, // head bottom when filing the cards in the answer stand
  FACE: 20, // cabinet front face
  DRAWERS: [-45.2, -22.6, 0, 22.6, 45.2], // drawer centres, one per chapter
  OPEN_W: 21.6,
  OPEN_Z: [8, 26],
  BOX_W: 20.4,
  WALL: 0.8,
  FLOOR: [8.4, 9.2],
  WALL_TOP: 20.5,
  INSIDE: 8, // how far behind the face the drawer's contents can be seen through the opening
  CARD_W: 17,
  CARD_T: 0.5,
  CARD_H: 13,
  CARDS: 12,
  TABS: [0, 6, 10], // guide cards with a tab
  IN_TOP: 16,
  OUT_TOP: 12,
  SLOT_DEPTH: 4, // filed passages sit this deep in the model's slot
  CARRIAGE_Z: 55,
  // The writer: a flat-bed plotter behind the model block that writes the answer.
  WRITE: {
    // Back-right corner of the base: nothing stands in front of it on screen.
    bed: { x: 68, y: -34, w: 24, d: 20, r: 1.2 },
    bedTop: 3.5,
    card: { x: 70.5, y: -31, w: 19, d: 14, r: 0.4 },
    cardTop: 3.9,
    rails: [-34, -15.5], // rail y (each 1.5 deep), on the bed
    railTop: 5,
    rows: [-28.4, -25.4, -22.4, -19.4], // answer lines, far to near
    x0: 72.5,
    lens: [15, 11, 13.5, 8],
    barZ: [10, 12],
    penTop: 7,
  },
};

const dmCardY = (j) => 17 - 3 * j;

// Three example doubts: which chapter drawer answers each, and which pair of cards.
const DOUBTS = [
  { drawer: 1, pair: 2, lines: [9, 6] },
  { drawer: 4, pair: 1, lines: [7, 9] },
  { drawer: 2, pair: 3, lines: [10, 5] },
];

// The drawer opens exactly far enough to bring its pair of cards under the picker.
const dmOut = (pair) => DM.PICK_Y - (dmCardY(pair) + dmCardY(pair + 1)) / 2;

// About 10 s per doubt.
const PHASES = [
  ["file", 0.6],
  ["toIn", 1.1],
  ["lowerRead", 0.35],
  ["read", 0.2],
  ["raiseRead", 0.35],
  ["toDrawer", 1.1],
  ["lowerGrab", 0.45],
  ["grip", 0.25],
  ["lift", 0.5],
  ["toOut", 1.2],
  ["lowerPlace", 0.45],
  ["release", 0.25],
  ["write", 2.2], // the head rises in the first 0.5 s while the model starts writing
  ["hold", 1.2],
];
const WRITE_START = 0.3; // the chip warms up before the first line
const WRITE_TIME = 1.8; // all four lines
const DRAWER_TIME = 0.7; // the drawer opens in the last 0.7 s of the trip there, and closes in the first 0.7 s out
const DM_CYCLE = PHASES.reduce((sum, [, d]) => sum + d, 0);
const DM_HOLD = PHASES[PHASES.length - 1][1];

const dmSmooth = (x) => {
  const t = Math.max(0, Math.min(1, x));
  return t * t * (3 - 2 * t);
};
const dmLerp = (a, b, t) => a + (b - a) * t;

const DM_EMPTY = { d: 0, doubtD: 0, k: -1, cx: DM.X_IN, hz: DM.HOME, grip: 0, drawer: -1, out: 0, doubtRise: 0, placed: false, sink: 1, carried: false, carryAlpha: 1, lifted: null, cardTop: DM.HOME - 1, core: 0, die: 0, written: 0, writtenAlpha: 1, rag: [0, 0, 0], phase: "hold" };

// The whole figure at time t of the cycle for doubt d, starting from snapshot S.
function dmState(d, t, S) {
  const { drawer: k, pair } = DOUBTS[d];
  const OUT = dmOut(pair);
  let name = "hold";
  let local = Infinity;
  let e = 1;
  let start = 0;
  for (const [n, dur] of PHASES) {
    if (t < start + dur) {
      name = n;
      local = t - start;
      e = dmSmooth(local / dur);
      break;
    }
    start += dur;
  }
  const at = (n) => PHASES.findIndex(([m]) => m === n);
  const i = at(name);
  const s = { d, doubtD: d, k, cx: DM.X_OUT, hz: DM.HOME, grip: 0, drawer: -1, out: 0, doubtRise: 1, placed: false, sink: 0, carried: false, carryAlpha: 1, lifted: null, core: 0, die: 0, written: 0, writtenAlpha: 1, rag: [0, 0, 0], phase: name };

  if (name === "file") {
    Object.assign(s, {
      doubtD: S.doubtD,
      cx: S.cx,
      hz: dmLerp(S.hz, DM.HOME, e),
      grip: dmLerp(S.grip, 0, e),
      drawer: S.drawer,
      out: dmLerp(S.out, 0, e),
      doubtRise: dmLerp(S.doubtRise, 0, e),
      placed: S.placed,
      core: S.core * (1 - e),
      die: S.die * (1 - e),
      written: S.written,
      writtenAlpha: S.writtenAlpha * (1 - e),
      rag: (S.rag || [0, 0, 0]).map((v) => v * (1 - e)),
      sink: dmLerp(S.sink, 1, e),
      carried: S.carried,
      carryAlpha: S.carryAlpha * (1 - e),
      lifted: S.lifted,
      cardTop: S.cardTop,
    });
    return s;
  }

  // Carriage position.
  if (name === "toIn") s.cx = dmLerp(S.cx, DM.X_IN, e);
  else if (i <= at("raiseRead")) s.cx = DM.X_IN;
  else if (name === "toDrawer") s.cx = dmLerp(DM.X_IN, DM.DRAWERS[k], e);
  else if (i <= at("lift")) s.cx = DM.DRAWERS[k];
  else if (name === "toOut") s.cx = dmLerp(DM.DRAWERS[k], DM.X_OUT, e);

  // Head height.
  const hz = {
    lowerRead: dmLerp(DM.HOME, DM.READ, e),
    read: DM.READ,
    raiseRead: dmLerp(DM.READ, DM.HOME, e),
    lowerGrab: dmLerp(DM.HOME, DM.GRAB, e),
    grip: DM.GRAB,
    lift: dmLerp(DM.GRAB, DM.HOME, e),
    lowerPlace: dmLerp(DM.HOME, DM.PLACE, e),
    release: DM.PLACE,
    write: dmLerp(DM.PLACE, DM.HOME, dmSmooth(local / 0.5)),
  }[name];
  if (hz !== undefined) s.hz = hz;

  // Jaws.
  if (name === "grip") s.grip = e;
  else if (i >= at("lift") && i <= at("lowerPlace")) s.grip = 1;
  else if (name === "release") s.grip = 1 - e;

  // The chapter drawer opens on the way there and closes on the way out.
  const tripTime = PHASES[at("toDrawer")][1];
  if (name === "toDrawer") (s.drawer = k), (s.out = OUT * dmSmooth((local - (tripTime - DRAWER_TIME)) / DRAWER_TIME));
  else if (i >= at("lowerGrab") && i <= at("lift")) (s.drawer = k), (s.out = OUT);
  else if (name === "toOut") (s.drawer = k), (s.out = OUT * (1 - dmSmooth(local / DRAWER_TIME)));

  if (name === "toIn") s.doubtRise = e;
  // From the moment the jaws come down, the pair is drawn by the picker (between its
  // jaws), standing where it stood in the drawer until the lift takes it up.
  if (i >= at("lowerGrab")) s.lifted = { drawer: k, pair };
  if (i >= at("lowerGrab") && i <= at("release")) s.carried = true;
  s.cardTop = i <= at("grip") ? DM.FLOOR[1] + DM.CARD_H : s.hz - 1;
  if (i >= at("write")) s.placed = true;

  // The AI: the core on the hoist glows while it reads the doubt and picks the
  // chapter; the model's chip glows while the plotter writes the answer.
  const trip = PHASES[at("toDrawer")][1];
  if (name === "lowerRead") s.core = e;
  else if (name === "read" || name === "raiseRead") s.core = 1;
  else if (name === "toDrawer") s.core = 1 - dmSmooth((local - (trip - 0.35)) / 0.35);
  if (name === "write") {
    s.die = dmSmooth(local / WRITE_START);
    s.written = DM.WRITE.rows.length * Math.max(0, Math.min(1, (local - WRITE_START) / WRITE_TIME));
  } else if (name === "hold") {
    s.die = 1 - dmSmooth(local / 0.5);
    s.written = DM.WRITE.rows.length;
  }

  // The RAG chip: R while the passages are Retrieved (to the drawer through the lift),
  // A while they Augment the model (carried over and filed in its slot), G while it
  // Generates (the same envelope as the model's chip). Neighbours crossfade.
  const FADE = 0.25;
  const span = (from, to) => {
    const a = at(from);
    const b = at(to);
    if (i < a || i > b) return 0;
    let v = 1;
    if (name === from) v = Math.min(v, dmSmooth(local / FADE));
    if (name === to) v = Math.min(v, 1 - dmSmooth((local - (PHASES[b][1] - FADE)) / FADE));
    return v;
  };
  s.rag = [span("toDrawer", "lift"), span("toOut", "release"), s.die];
  return s;
}

// Where the plotter's pen is for a given amount written: each line is three
// quarters writing (pen down, bridge moving along x) and a quarter returning
// (pen up) to the start of the next line, and after the last one to the first.
function dmPen(written) {
  const W = DM.WRITE;
  const n = W.rows.length;
  if (written <= 0 || written >= n) return { x: W.x0, y: W.rows[0], down: false, line: n, part: 0 };
  const line = Math.floor(written);
  const f = written - line;
  if (f < 0.75) return { x: W.x0 + W.lens[line] * (f / 0.75), y: W.rows[line], down: true, line, part: f / 0.75 };
  const q = dmSmooth((f - 0.75) / 0.25);
  const next = line + 1 < n ? W.rows[line + 1] : W.rows[0];
  return { x: dmLerp(W.x0 + W.lens[line], W.x0, q), y: dmLerp(W.rows[line], next, q), down: false, line: line + 1, part: 0 };
}

function dmWords(s) {
  const n = s.d + 1;
  const ch = s.k + 1;
  switch (s.phase) {
    case "file":
    case "toIn":
      return `Doubt ${n} \u00b7 in`;
    case "lowerRead":
    case "read":
    case "raiseRead":
      return `Doubt ${n} \u00b7 reading`;
    case "toDrawer":
      return `Doubt ${n} \u00b7 finding chapter ${ch}`;
    case "lowerGrab":
    case "grip":
    case "lift":
      return `Doubt ${n} \u00b7 pulling 2 passages, ch ${ch}`;
    case "toOut":
    case "lowerPlace":
    case "release":
      return `Doubt ${n} \u00b7 filing 2 passages`;
    case "write":
      return `Doubt ${n} \u00b7 writing from them`;
    default:
      return `Doubt ${n} \u00b7 answered from ch ${ch}`;
  }
}

// --- drawing -------------------------------------------------------------

const dmPlan = (x, y, w, d, r = 0.15) => ({ x, y, w, d, r });

function dmCard(cx, yc, z0, z1, P, K, { tone = "mid", lit = false, tab = -1 } = {}) {
  if (z1 - z0 < 0.05) return "";
  const out = [K.solidSvg(K.slabOf(dmPlan(cx - DM.CARD_W / 2, yc - DM.CARD_T / 2, DM.CARD_W, DM.CARD_T), z0, z1 - z0, P, 2), { tone, lit, crease: "none" })];
  if (tab >= 0) out.push(K.solidSvg(K.slabOf(dmPlan(cx - DM.CARD_W / 2 + 1 + tab * 5, yc - DM.CARD_T / 2, 4, DM.CARD_T), z1, 1.8, P, 2), { tone, lit, crease: "none" }));
  return out.join("");
}

// One drawer, pulled out by `out`. "back" is what lies behind the picker's plane,
// "front" what lies in front of it (drawn after the picker), panel last.
function dmDrawer(i, out, lifted, part, P, K, panel) {
  const c = DM.DRAWERS[i];
  const x0 = c - DM.BOX_W / 2;
  const x1 = c + DM.BOX_W / 2 - DM.WALL;
  const front = DM.FACE + out;
  const inside = DM.FACE - DM.INSIDE;
  const gone = lifted && lifted.drawer === i ? [lifted.pair, lifted.pair + 1] : [];
  const cards = [];
  for (let j = DM.CARDS - 1; j >= 0; j--) {
    if (gone.includes(j)) continue;
    const y = dmCardY(j) + out;
    if (y < inside) continue;
    cards.push({ y, j });
  }
  const floor = (y0, y1) => K.solidSvg(K.slabOf(dmPlan(x0, y0, DM.BOX_W, y1 - y0, 0), DM.FLOOR[0], DM.FLOOR[1] - DM.FLOOR[0], P, 2), { tone: "lo", crease: "none" });
  const wall = (x, y0, y1) => K.solidSvg(K.slabOf(dmPlan(x, y0, DM.WALL, y1 - y0, 0), DM.FLOOR[1], DM.WALL_TOP - DM.FLOOR[1], P, 2), { tone: "mid" });
  const card = ({ y, j }) => dmCard(c, y, DM.FLOOR[1], DM.FLOOR[1] + DM.CARD_H, P, K, { tab: DM.TABS.includes(j) ? DM.TABS.indexOf(j) : -1 });
  if (part === "back") {
    const seen = Math.min(front, DM.FACE);
    const inner = [floor(inside, seen), wall(x0, inside, seen), ...cards.filter((q) => q.y < DM.FACE).map(card), wall(x1, inside, seen)].join("");
    const outer = out > DM.WALL ? [floor(DM.FACE, front), wall(x0, DM.FACE, front), ...cards.filter((q) => q.y >= DM.FACE && q.y < DM.PICK_Y).map(card)].join("") : "";
    return `<g clip-path="url(#dm-open-${i})">${inner}</g>${outer}`;
  }
  const outer = out > DM.WALL ? [...cards.filter((q) => q.y >= DM.PICK_Y).map(card), wall(x1, DM.FACE, front)].join("") : "";
  return `${outer}<g transform="${K.translateAlong(P, [0, out, 0])}">${panel}</g>`;
}

function dmDoubtCard(s, P, K) {
  const h = 11 * s.doubtRise;
  if (h < 0.05) return "";
  const x = DM.X_IN;
  const top = DM.IN_TOP + h;
  // The doubt card is narrower than a drawer card.
  const out = [];
  out.push(K.solidSvg(K.slabOf(dmPlan(x - 7, DM.PICK_Y - DM.CARD_T / 2, 14, DM.CARD_T), DM.IN_TOP, h, P, 2), { tone: "hi", crease: "none" }));
  const face = DM.PICK_Y + DM.CARD_T / 2;
  if (top - 5.4 > DM.IN_TOP + 0.4) out.push(K.faceTextSvg(K.sideMatrix([x - 5.6, face], top - 5.4, P, "left"), "?", { size: 4.6, tone: "hi" }));
  const lines = DOUBTS[s.doubtD].lines;
  lines.forEach((length, row) => {
    const z = top - 2.6 - row * 2.2;
    if (z > DM.IN_TOP + 0.4) out.push(K.lineSvg(K.segment([x - 1.6, face, z], [x - 1.6 + length * 0.6, face, z], P), { tone: "mid", free: true }));
  });
  return out.join("");
}

// The two passages filed in the model's slot: the context it writes from.
function dmAnswer(s, P, K) {
  const out = [];
  const x = DM.X_OUT;
  if (s.placed) {
    const top = DM.OUT_TOP - DM.SLOT_DEPTH + DM.CARD_H - s.sink * (DM.CARD_H - DM.SLOT_DEPTH + 0.2);
    for (const y of [28.5, 31.5]) out.push(dmCard(x, y, DM.OUT_TOP, top, P, K, { tone: "hi", lit: true }));
  }
  return out.join("");
}

function dmPicker(s, P, K) {
  const { cx, hz } = s;
  const gap = (1 - s.grip) * 0.8;
  const jaw = (y0) => K.solidSvg(K.slabOf(dmPlan(cx - 5, y0, 10, 0.6, 0.2), hz - 6, 6, P, 2), { tone: "mid" });
  const out = [jaw(27.65 - gap)];
  if (s.carried && s.carryAlpha > 0.01) {
    const top = s.cardTop;
    // Over the answer stand the cards go into its slot: draw only what sticks out.
    const bottom = Math.max(top - DM.CARD_H, Math.abs(cx - DM.X_OUT) < 1 ? DM.OUT_TOP : -Infinity);
    const cards = [28.5, 31.5].map((y) => dmCard(cx, y, bottom, top, P, K, { tone: "hi", lit: true })).join("");
    out.push(s.carryAlpha < 1 ? `<g opacity="${s.carryAlpha.toFixed(3)}">${cards}</g>` : cards);
  }
  out.push(jaw(31.75 + gap));
  out.push(K.solidSvg(K.slabOf(dmPlan(cx - 6, 27, 12, 6, 0.8), hz, 4, P, 3, 0.4), { tone: "mid" }));
  out.push(K.dotsSvg([K.iso([cx - 4.4, 28.4, hz + 4], P), K.iso([cx + 4.4, 31.6, hz + 4], P)], { size: 0.4 }));
  for (const dx of [-3, 3]) out.push(K.wireSvg(K.iso([cx + dx, DM.PICK_Y, DM.CARRIAGE_Z], P), K.iso([cx + dx, DM.PICK_Y, hz + 4], P), { tone: "mid", size: 0.55 }));
  return out.join("");
}

// The plotter: the answer card's lines, then the bridge and pen over it.
function dmWriter(s, P, K) {
  const W = DM.WRITE;
  const out = [];
  const pen = dmPen(s.written);
  const lines = W.rows
    .map((y, row) => {
      const p = s.written >= row + 0.75 ? 1 : s.written > row ? (s.written - row) / 0.75 : 0;
      const length = W.lens[row] * p;
      return length > 0.05 ? K.lineSvg(K.lineOnTop([W.x0, y], [W.x0 + length, y], W.cardTop, P), { tone: "hi", free: true }) : "";
    })
    .join("");
  if (lines && s.writtenAlpha > 0.01) out.push(s.writtenAlpha < 1 ? `<g opacity="${s.writtenAlpha.toFixed(3)}">${lines}</g>` : lines);
  // The bridge rides two rails along x; the pen carriage hangs under it and moves along y.
  const bx = pen.x;
  const [r0, r1] = W.rails;
  const tower = (y) => K.solidSvg(K.slabOf(dmPlan(bx - 1.5, y, 3, 1.5, 0.4), W.railTop, W.barZ[0] - W.railTop, P, 2), { tone: "mid" });
  out.push(tower(r0));
  const tip = pen.down ? W.cardTop : W.cardTop + 1.2;
  out.push(K.solidSvg(K.cylinder(bx, pen.y, 0.45, tip, W.penTop - tip, P, 12), { tone: "hi", crease: "none" }));
  out.push(K.solidSvg(K.slabOf(dmPlan(bx - 1.6, pen.y - 1.6, 3.2, 3.2, 0.5), W.penTop, W.barZ[0] - W.penTop, P, 2, 0.2), { tone: "mid" }));
  out.push(tower(r1));
  out.push(K.solidSvg(K.slabOf(dmPlan(bx - 1.5, r0, 3, r1 + 1.5 - r0, 0.5), W.barZ[0], W.barZ[1] - W.barZ[0], P, 2, 0.3), { tone: "mid" }));
  return out.join("");
}

function dmRender(s, P, K, panels) {
  const open = s.drawer >= 0 && s.out > 0.05;
  // The drawer's front is redrawn after the picker only while it stands in front of the
  // picker's jaws; nearly closed, it is behind them and is drawn whole before the picker.
  const split = open && DM.FACE + s.out > DM.PICK_Y + 2.4;
  const whole = (i) => dmDrawer(i, s.out, s.lifted, "back", P, K) + (split ? "" : dmDrawer(i, s.out, s.lifted, "front", P, K, panels[i]));
  return {
    writer: dmWriter(s, P, K),
    doubt: dmDoubtCard(s, P, K),
    backs: DM.DRAWERS.map((_, i) => (open && i === s.drawer ? whole(i) : "")),
    answer: dmAnswer(s, P, K),
    picker: dmPicker(s, P, K),
    front: split ? dmDrawer(s.drawer, s.out, s.lifted, "front", P, K, panels[s.drawer]) : "",
  };
}

const P = DATA.P;
const K = { cylinder, lineOnTop, slabOf, solidSvg, lineSvg, dotsSvg, iso, pathOf, wireSvg, segment, faceTextSvg, sideMatrix, translateAlong };
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const slot = (name) => svg.querySelector(`[data-slot="${name}"]`);
const slots = {
  writer: slot("writer"),
  doubt: slot("doubt"),
  backs: DM.DRAWERS.map((_, i) => slot(`back-${i}`)),
  answer: slot("answer"),
  picker: slot("picker"),
  front: slot("front"),
};
const panels = DM.DRAWERS.map((_, i) => svg.querySelector(`[data-panel="${i}"]`));
const carriageEl = svg.querySelector('[data-part="carriage"]');
const coreGlow = svg.querySelector('[data-glow="core"]');
const dieGlow = svg.querySelector('[data-glow="die"]');
const ragLit = [0, 1, 2].map((i) => svg.querySelector(`[data-rag="${i}"] .dm-rag-lit`));
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

let cycle = { d: 0, t: DM_CYCLE - DM_HOLD, S: DM_EMPTY };
let state = dmState(cycle.d, cycle.t, cycle.S);
let touring = !still.matches;
let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
let lastSaid = "";
const drawn = { writer: null, doubt: null, backs: [], answer: null, picker: null, front: null };

const put = (el, html, key, index) => {
  const previous = index === undefined ? drawn[key] : drawn[key][index];
  if (previous === html) return;
  el.innerHTML = html;
  if (index === undefined) drawn[key] = html;
  else drawn[key][index] = html;
};

function draw() {
  const R = dmRender(state, P, K, DATA.panels);
  put(slots.writer, R.writer, "writer");
  put(slots.doubt, R.doubt, "doubt");
  coreGlow.style.opacity = state.core.toFixed(3);
  dieGlow.style.opacity = state.die.toFixed(3);
  ragLit.forEach((el, i) => (el.style.opacity = state.rag[i].toFixed(3)));
  R.backs.forEach((html, i) => put(slots.backs[i], html, "backs", i));
  put(slots.answer, R.answer, "answer");
  put(slots.picker, R.picker, "picker");
  put(slots.front, R.front, "front");
  // An open drawer's front is redrawn in the front slot, after the picker.
  panels.forEach((el, i) => (el.style.display = i === state.drawer && state.out > 0.05 ? "none" : ""));
  carriageEl.setAttribute("transform", translateAlong(P, [state.cx, 0, 0]));
  const text = dmWords(state);
  if (readout && readout.textContent !== text) readout.textContent = text;
  if (state.phase === "hold" && text !== lastSaid) {
    lastSaid = text;
    status.textContent = text;
  }
}

function start(d) {
  cycle = { d, t: still.matches ? DM_CYCLE : 0, S: state };
  state = dmState(cycle.d, cycle.t, cycle.S);
  draw();
  run();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  cycle.t += dt;
  if (cycle.t >= DM_CYCLE) {
    if (touring) {
      start((cycle.d + 1) % DOUBTS.length);
      frame = visible ? requestAnimationFrame(tick) : 0;
      return;
    }
    cycle.t = DM_CYCLE;
  }
  state = dmState(cycle.d, cycle.t, cycle.S);
  draw();
  frame = visible && (touring || cycle.t < DM_CYCLE) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function ask(d) {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    run();
  }, 9000);
  start(d);
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

stage.addEventListener("click", () => ask((cycle.d + 1) % DOUBTS.length));
stage.addEventListener("keydown", (event) => {
  const n = Number(event.key);
  let to = null;
  if (n >= 1 && n <= DOUBTS.length) to = n - 1;
  if (event.key === "Enter" || event.key === " " || event.key === "ArrowRight") to = (cycle.d + 1) % DOUBTS.length;
  if (event.key === "ArrowLeft") to = (cycle.d + DOUBTS.length - 1) % DOUBTS.length;
  if (to === null) return;
  event.preventDefault();
  ask(to);
});
still.addEventListener("change", () => {
  if (still.matches) touring = false;
  run();
});

// Debug: #freeze=d,t holds doubt d (0-based) at t seconds into its cycle, for stills.
const freeze = /freeze=(\d+),([\d.]+)/.exec(location.hash);
if (freeze) {
  touring = false;
  visible = false;
  cycle = { d: Number(freeze[1]), t: Number(freeze[2]), S: state };
  state = dmState(cycle.d, cycle.t, cycle.S);
  run = () => {};
}

window.__dm = { ask, get: () => ({ d: cycle.d, t: cycle.t, phase: state.phase }), seek: (d, t) => { touring = false; cycle = { d, t, S: state }; state = dmState(d, t, cycle.S); draw(); } };
draw();
</script></body></html>
